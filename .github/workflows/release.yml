name: Release

# Pushing a version tag (e.g. `git tag v2.2.0 && git push origin v2.2.0`)
# tests, cross-compiles, and publishes a GitHub release with binaries.
# Tags with a suffix (v2.2.0-rc.1) are published as pre-releases.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            name="seasoned_${VERSION}_${os}_${arch}"
            stage="build/${name}"
            mkdir -p "$stage"

            bin="seasoned"
            [ "$os" = windows ] && bin="seasoned.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/${bin}" ./cmd/seasoned

            cp README.md LICENSE config.example.yaml "$stage/"
            case "$os" in
              linux)   cp -r dist/systemd "$stage/" ;;
              darwin)  cp -r dist/launchd "$stage/" ;;
              windows) cp -r dist/windows "$stage/" ;;
            esac

            if [ "$os" = windows ]; then
              (cd build && zip -qr "../out/${name}.zip" "$name")
            else
              tar -C build -czf "out/${name}.tar.gz" "$name"
            fi
          done
          (cd out && sha256sum * > checksums.txt)
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Release was already created by hand: just attach the binaries.
            gh release upload "$VERSION" out/* --clobber
          else
            flags=()
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$VERSION" out/* \
              --verify-tag \
              --title "$VERSION" \
              --generate-notes \
              "${flags[@]}"
          fi
